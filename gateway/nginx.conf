# API Gateway: único punto de entrada para el frontend. Enruta por prefijo a cada microservicio.
server {
    listen 80;

    # CORS (el frontend desplegado en otro dominio llama al gateway)
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    if ($request_method = OPTIONS) { return 204; }

    # Resolución dinámica: evita que nginx caiga si un servicio aún no arrancó
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health { return 200 '{"service":"gateway","status":"ok"}'; add_header Content-Type application/json; }

    # /api/catalog/xxx  ->  catalog-service /api/xxx   (MongoDB)
    location /api/catalog/ {
        set $catalog http://catalog-service:8000;
        rewrite ^/api/catalog/(.*)$ /api/$1 break;
        proxy_pass $catalog;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # /api/library/xxx  ->  loans-service /api/xxx     (usuarios, préstamos, multas - Supabase / PostgreSQL)
    location /api/library/ {
        set $loans http://loans-service:8000;
        rewrite ^/api/library/(.*)$ /api/$1 break;
        proxy_pass $loans;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
